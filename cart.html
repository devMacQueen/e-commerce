<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Page</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#4f46e5", secondary: "#f97316" },
          borderRadius: {
            none: "0px",
            sm: "4px",
            DEFAULT: "8px",
            md: "12px",
            lg: "16px",
            xl: "20px",
            "2xl": "24px",
            "3xl": "32px",
            full: "9999px",
            button: "8px",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    @media (max-width: 768px) {
      .responsive-table {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body class="bg-white min-h-screen">
  <div x-data="cart()" class="container mx-auto px-4 py-12 max-w-6xl">
    <div class="flex justify-between items-center mb-12">
      <h1 class="text-3xl font-bold text-gray-900">Shopping Cart</h1>
      <div class="bg-primary text-white text-sm font-medium px-4 py-1.5 rounded-full flex items-center">
        <i class="fas fa-shopping-cart mr-2"></i>
        <span x-text="cartItems.length"></span> <span class="hidden sm:inline ml-1">items</span>
      </div>
    </div>

    <div class="space-y-6">
      <div x-show="cartItems.length === 0" class="bg-gray-500 rounded-lg p-10 text-center">
        <i class="fas fa-shopping-cart text-gray-300 text-5xl mb-4"></i>
        <p class="text-xl text-gray-500">Your cart is empty</p>
        <a href="./index.html"
          class="inline-block mt-6 py-3 px-6 bg-primary text-white font-medium rounded-button hover:bg-primary/90 transition-colors whitespace-nowrap">
          Continue Shopping
        </a>
      </div>

      <div class="sm:hidden">
        <template x-for="(item, index) in cartItems" :key="index">
          <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-4 mb-4">
            <div class="flex justify-between items-start">
              <div class="flex items-start space-x-3">
                <img :src="item.image || 'https://via.placeholder.com/80'" alt="Product"
                  class="w-20 h-20 object-cover rounded">
                <div>
                  <h2 class="font-medium text-gray-900 text-lg" x-text="item.name"></h2>
                  <p class="text-sm text-gray-500" x-text="item.model"></p>
                </div>
              </div>
              <button @click="removeItem(index)" class="text-gray-400 hover:text-rose-500 transition-colors">
                <i class="fas fa-trash"></i>
              </button>
            </div>

            <div class="mt-4 space-y-2">
              <div class="flex justify-between">
                <span class="text-gray-600">HS Code:</span>
                <span class="text-gray-900" x-text="item.hsCode"></span>
              </div>

              <div class="flex justify-between items-center">
                <span class="text-gray-600">Color:</span>
                <div class="flex items-center">
                  <select x-model="item.color"
                    class="text-sm border border-gray-200 rounded p-1 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="Black">Black</option>
                    <option value="Silver">Silver</option>
                    <option value="Blue">Blue</option>
                    <option value="Red">Red</option>
                    <option value="White">White</option>
                  </select>
                  <div class="w-4 h-4 ml-2 rounded-full border border-gray-200"
                    :style="`background-color: ${getColorHex(item.color)}`"></div>
                </div>
              </div>

              <div class="flex justify-between items-center">
                <span class="text-gray-600">Quantity:</span>
                <div class="flex items-center border border-gray-200 rounded">
                  <button @click="decrementQuantity(index)"
                    class="px-2 py-1 text-gray-500 hover:text-primary transition-colors">
                    <i class="fas fa-minus text-xs"></i>
                  </button>
                  <input type="number" x-model.number="item.quantity" @change="updateTotalPrice(index)" min="1"
                    class="w-12 text-center border-x border-gray-200 focus:outline-none" />
                  <button @click="incrementQuantity(index)"
                    class="px-2 py-1 text-gray-500 hover:text-primary transition-colors">
                    <i class="fas fa-plus text-xs"></i>
                  </button>
                </div>
              </div>

              <div class="flex justify-between">
                <span class="text-gray-600">Weight:</span>
                <span class="text-gray-900" x-text="item.weight + ' kg'"></span>
              </div>

              <div class="flex justify-between">
                <span class="text-gray-600">Delivery:</span>
                <select x-model="item.deliveryMethod"
                  class="text-sm border border-gray-200 rounded p-1 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                  <option value="Air">Air</option>
                  <option value="Ship">Ship</option>
                  <option value="Express">Express</option>
                </select>
              </div>

              <div class="flex justify-between font-medium text-gray-900">
                <span>Price:</span>
                <span x-text="'$' + item.perPieceRate.toFixed(2)"></span>
              </div>

              <div class="flex justify-between font-bold text-gray-900">
                <span>Total:</span>
                <span x-text="'$' + item.totalPrice.toFixed(2)"></span>
              </div>

              <div class="pt-2 border-t border-gray-100 mt-2">
                <button @click="item.showDescription = !item.showDescription"
                  class="text-primary text-sm flex items-center">
                  <span x-text="item.showDescription ? 'Hide Description' : 'Show Description'"></span>
                  <i class="fas ml-1" :class="item.showDescription ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                </button>

                <div x-show="item.showDescription" class="mt-2">
                  <div x-show="!item.isEditingDescription">
                    <p class="text-sm text-gray-600" x-text="item.description"></p>
                    <button @click="startEditingDescription(index)" class="text-xs text-primary mt-1">
                      <i class="fas fa-edit mr-1"></i> Edit
                    </button>
                  </div>

                  <div x-show="item.isEditingDescription">
                    <textarea x-model="item.description"
                      class="w-full text-sm border border-gray-200 rounded p-2 mt-1 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
                      rows="3"></textarea>
                    <div class="flex justify-end space-x-2 mt-2">
                      <button @click="cancelEditingDescription(index)"
                        class="text-xs px-3 py-1 border border-gray-200 rounded-button hover:bg-gray-50 transition-colors">
                        Cancel
                      </button>
                      <button @click="saveDescription(index)"
                        class="text-xs px-3 py-1 bg-primary text-white rounded-button hover:bg-primary/90 transition-colors">
                        Save
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="hidden sm:block">
        <div class="responsive-table">
          <table class="w-full bg-white rounded-lg border border-gray-100 shadow-sm overflow-hidden"
            x-show="cartItems.length > 0">
            <thead class="bg-gray-500 text-white">
              <tr>
                <th class="py-3 px-4 text-left font-semibold">Product</th>
                <th class="py-3 px-4 text-left font-semibold">Details</th>
                <th class="py-3 px-4 text-center font-semibold">Quantity</th>
                <th class="py-3 px-4 text-right font-semibold">Price</th>
                <th class="py-3 px-4 text-right font-semibold">Total</th>
                <th class="py-3 px-4 text-center font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(item, index) in cartItems" :key="index">
                <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
                  <td class="py-4 px-4">
                    <div class="flex items-center space-x-3">
                      <img :src="item.image || 'https://via.placeholder.com/80'" alt="Product"
                        class="w-16 h-16 object-cover rounded">
                      <div>
                        <h3 class="font-medium text-gray-900" x-text="item.name"></h3>
                        <p class="text-sm text-gray-500" x-text="item.model"></p>
                        <p class="text-xs text-gray-500" x-text="'HS: ' + item.hsCode"></p>
                      </div>
                    </div>
                  </td>
                  <td class="py-4 px-4">
                    <div class="space-y-2">
                      <div class="flex items-center">
                        <span class="text-sm text-gray-600 mr-2">Color:</span>
                        <select x-model="item.color"
                          class="text-sm border border-gray-200 rounded p-1 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                          <option value="Black">Black</option>
                          <option value="Silver">Silver</option>
                          <option value="Blue">Blue</option>
                          <option value="Red">Red</option>
                          <option value="White">White</option>
                        </select>
                        <div class="w-4 h-4 ml-2 rounded-full border border-gray-200"
                          :style="`background-color: ${getColorHex(item.color)}`"></div>
                      </div>
                      <div class="flex items-center">
                        <span class="text-sm text-gray-600 mr-2">Delivery:</span>
                        <select x-model="item.deliveryMethod"
                          class="text-sm border border-gray-200 rounded p-1 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
                          :class="{'bg-indigo-50 text-primary': item.deliveryMethod === 'Air',
                                  'bg-green-50 text-green-800': item.deliveryMethod === 'Ship',
                                  'bg-amber-50 text-amber-800': item.deliveryMethod === 'Express'}">
                          <option value="Air">Air</option>
                          <option value="Ship">Ship</option>
                          <option value="Express">Express</option>
                        </select>
                      </div>
                      <div class="flex items-center">
                        <span class="text-sm text-gray-600 mr-2">Weight:</span>
                        <span class="text-sm text-gray-900" x-text="item.weight + ' kg'"></span>
                      </div>
                      <button @click="toggleDescription(index)" class="text-xs text-primary flex items-center mt-1">
                        <span x-text="item.showDescription ? 'Hide Description' : 'Show Description'"></span>
                        <i class="fas ml-1" :class="item.showDescription ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                      </button>
                    </div>
                  </td>
                  <td class="py-4 px-4 text-center">
                    <div class="flex items-center justify-center">
                      <button @click="decrementQuantity(index)"
                        class="px-2 py-1 text-gray-500 border border-gray-200 rounded-l hover:bg-gray-50 transition-colors">
                        <i class="fas fa-minus text-xs"></i>
                      </button>
                      <input type="number" x-model.number="item.quantity" @change="updateTotalPrice(index)" min="1"
                        class="w-12 text-center border-y border-gray-200 focus:outline-none" />
                      <button @click="incrementQuantity(index)"
                        class="px-2 py-1 text-gray-500 border border-gray-200 rounded-r hover:bg-gray-50 transition-colors">
                        <i class="fas fa-plus text-xs"></i>
                      </button>
                    </div>
                  </td>
                  <td class="py-4 px-4 text-right">
                    <span class="font-medium text-gray-900" x-text="'$' + item.perPieceRate.toFixed(2)"></span>
                  </td>
                  <td class="py-4 px-4 text-right">
                    <span class="font-bold text-gray-900" x-text="'$' + item.totalPrice.toFixed(2)"></span>
                  </td>
                  <td class="py-4 px-4 text-center">
                    <button @click="removeItem(index)" class="text-gray-400 hover:text-rose-500 p-1 transition-colors">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
                <tr x-show="item.showDescription" class="bg-gray-500">
                  <td colspan="6" class="py-3 px-6">
                    <div x-show="!item.isEditingDescription">
                      <p class="text-sm text-gray-700" x-text="item.description"></p>
                      <button @click="startEditingDescription(index)" class="text-xs text-primary mt-1">
                        <i class="fas fa-edit mr-1"></i> Edit Description
                      </button>
                    </div>
                    <div x-show="item.isEditingDescription">
                      <textarea x-model="item.description"
                        class="w-full text-sm border border-gray-200 rounded p-2 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
                        rows="2"></textarea>
                      <div class="flex justify-end space-x-2 mt-2">
                        <button @click="cancelEditingDescription(index)"
                          class="text-xs px-3 py-1 border border-gray-200 rounded-button hover:bg-gray-100 transition-colors">
                          Cancel
                        </button>
                        <button @click="saveDescription(index)"
                          class="text-xs px-3 py-1 bg-primary text-white rounded-button hover:bg-primary/90 transition-colors">
                          Save
                        </button>
                      </div>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <div x-show="cartItems.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2">
          <div class="bg-gray-500 rounded-lg p-4 sm:p-6 mb-6">
            <h2 class="text-lg font-semibold text-white mb-4">Shipping Options</h2>
            <div class="space-y-3">
              <label
                class="flex items-center p-3 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="shippingMethod" value="standard" x-model="shippingMethod"
                  class="mr-3 accent-primary">
                <div>
                  <div class="font-medium text-gray-500">Standard Shipping</div>
                  <div class="text-sm text-gray-600">Delivery in 5-7 business days</div>
                </div>
                <div class="ml-auto font-medium text-gray-900">$5.00</div>
              </label>

              <label
                class="flex items-center p-3 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="shippingMethod" value="express" x-model="shippingMethod"
                  class="mr-3 accent-primary">
                <div>
                  <div class="font-medium text-gray-900">Express Shipping</div>
                  <div class="text-sm text-gray-600">Delivery in 1-3 business days</div>
                </div>
                <div class="ml-auto font-medium text-gray-900">$15.00</div>
              </label>

              <label
                class="flex items-center p-3 bg-white border border-gray-200 rounded cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="shippingMethod" value="overnight" x-model="shippingMethod"
                  class="mr-3 accent-primary">
                <div>
                  <div class="font-medium text-gray-900">Overnight Shipping</div>
                  <div class="text-sm text-gray-600">Next day delivery</div>
                </div>
                <div class="ml-auto font-medium text-gray-900">$25.00</div>
              </label>
            </div>
          </div>

          <div class="bg-gray-500 rounded-lg p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-white mb-4">Promo Code</h2>
            <div class="flex">
              <input type="text" x-model="promoCode" placeholder="Enter promo code"
                class="flex-grow border border-gray-200 rounded-l-button p-2 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
              <button @click="applyPromoCode"
                class="bg-primary text-white px-5 py-2 font-medium rounded-r-button hover:bg-primary/90 transition-colors">
                Apply
              </button>
            </div>
            <div x-show="promoMessage" class="mt-2 text-sm" :class="promoValid ? 'text-green-600' : 'text-rose-600'">
              <span x-text="promoMessage"></span>
            </div>
          </div>
        </div>

        <div class="md:col-span-1">
          <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-4 sm:p-6 sticky top-4">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Order Summary</h2>
            <div class="space-y-3 mb-4">
              <div class="flex justify-between">
                <span class="text-gray-600">Subtotal</span>
                <span class="font-medium text-gray-900" x-text="'$' + subtotal.toFixed(2)"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">Shipping</span>
                <span class="font-medium text-gray-900" x-text="'$' + shippingCost.toFixed(2)"></span>
              </div>
              <div x-show="discount > 0" class="flex justify-between text-green-600">
                <span>Discount</span>
                <span class="font-medium" x-text="'-$' + discount.toFixed(2)"></span>
              </div>
              <div class="flex justify-between text-gray-600">
                <span>Tax</span>
                <span class="font-medium text-gray-900" x-text="'$' + calculateTax().toFixed(2)"></span>
              </div>
              <div class="border-t border-gray-100 pt-3 mt-3">
                <div class="flex justify-between font-bold text-lg text-gray-900">
                  <span>Total</span>
                  <span x-text="'$' + total.toFixed(2)"></span>
                </div>
              </div>
            </div>
            <button
              class="w-full bg-primary text-white py-3 rounded-button font-medium hover:bg-primary/90 transition-colors flex items-center justify-center"
              :disabled="cartItems.length === 0" :class="{'opacity-50 cursor-not-allowed': cartItems.length === 0}">
              <i class="fas fa-lock mr-2"></i> Proceed to Checkout
            </button>
            <div class="flex items-center justify-center mt-4 text-sm text-gray-600">
              <i class="fas fa-shield-alt mr-2"></i> Secure Checkout
            </div>
            <div class="flex justify-center space-x-3 mt-4 text-2xl text-gray-600">
              <i class="fab fa-cc-visa"></i>
              <i class="fab fa-cc-mastercard"></i>
              <i class="fab fa-cc-amex"></i>
              <i class="fab fa-cc-paypal"></i>
            </div>
          </div>
        </div>
      </div>

      <div x-show="cartItems.length > 0" class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <a href="index.html" class="flex items-center text-gray-800 font-medium hover:text-primary transition-colors">
          <i class="fas fa-arrow-left mr-2"></i>
          Continue Shopping
        </a>
        <button @click="clearCart" class="text-gray-500 hover:text-rose-500 transition-colors">
          <i class="fas fa-trash mr-1"></i> Clear Cart
        </button>
      </div>
    </div>
  </div>


  <script src="./cart.js"></script>
  <script>
    function cart() {
      return {
        cartItems: [],
        shippingMethod: "standard",
        promoCode: "",
        promoMessage: "",
        promoValid: false,
        discount: 0,

        init() {
          this.cartItems = getCart().map((i) => ({
            id: i.id,
            name: i.title,
            model: i.brand || "",
            hsCode: "",
            quantity: i.quantity,
            weight: i.weight || 0,
            perPieceRate: i.price,
            totalPrice: i.price * i.quantity,
            color: "Black",
            deliveryMethod: "Air",
            description: i.description || "",
            isEditingDescription: false,
            originalDescription: "",
            showDescription: false,
            image: i.thumbnail,
          }));

          this.$watch("cartItems", () => this.persist());
        },

        persist() {
          saveCart(
            this.cartItems.map((i) => ({
              id: i.id,
              title: i.name,
              price: i.perPieceRate,
              thumbnail: i.image,
              description: i.description,
              brand: i.model,
              weight: i.weight,
              quantity: i.quantity,
            }))
          );
        },

        removeItem(index) {
          if (confirm('Are you sure you want to remove this item?')) {
            this.cartItems.splice(index, 1);
          }
        },

        clearCart() {
          if (confirm('Are you sure you want to clear your cart?')) {
            this.cartItems = [];
          }
        },

        incrementQuantity(index) {
          this.cartItems[index].quantity++;
          this.updateTotalPrice(index);
        },

        decrementQuantity(index) {
          if (this.cartItems[index].quantity > 1) {
            this.cartItems[index].quantity--;
            this.updateTotalPrice(index);
          }
        },

        updateTotalPrice(index) {
          const item = this.cartItems[index];
          if (!item.quantity || item.quantity < 1) item.quantity = 1;
          item.totalPrice = item.perPieceRate * item.quantity;
        },

        toggleDescription(index) {
          this.cartItems[index].showDescription = !this.cartItems[index].showDescription;
        },

        startEditingDescription(index) {
          this.cartItems[index].originalDescription = this.cartItems[index].description;
          this.cartItems[index].isEditingDescription = true;
        },

        saveDescription(index) {
          this.cartItems[index].isEditingDescription = false;
          console.log(`Description updated for ${this.cartItems[index].name}`);
        },

        cancelEditingDescription(index) {
          this.cartItems[index].description = this.cartItems[index].originalDescription;
          this.cartItems[index].isEditingDescription = false;
        },

        getColorHex(color) {
          const colorMap = {
            'Black': '#000000',
            'Silver': '#C0C0C0',
            'Blue': '#0047AB',
            'Red': '#FF0000',
            'White': '#FFFFFF'
          };
          return colorMap[color] || '#000000';
        },

        applyPromoCode() {
          const promoCodes = {
            'SAVE10': { discount: 0.1, message: '10% discount applied!' },
            'FREESHIP': { discount: 0, message: 'Free shipping applied!', freeShipping: true },
            'WELCOME20': { discount: 0.2, message: '20% discount applied!' }
          };

          if (this.promoCode.trim() === '') {
            this.promoMessage = 'Please enter a promo code';
            this.promoValid = false;
            return;
          }

          const promo = promoCodes[this.promoCode.toUpperCase()];
          if (promo) {
            this.promoValid = true;
            this.promoMessage = promo.message;

            if (promo.discount) {
              this.discount = this.subtotal * promo.discount;
            }

            if (promo.freeShipping) {
              this.shippingMethod = 'standard';
              this.shipping = 0;
            }
          } else {
            this.promoValid = false;
            this.promoMessage = 'Invalid promo code';
            this.discount = 0;
          }
        },

        calculateTax() {
          return (this.subtotal - this.discount) * 0.075;
        },

        get subtotal() {
          return this.cartItems.reduce((sum, item) => sum + item.totalPrice, 0);
        },

        get shippingCost() {
          const shippingRates = {
            'standard': 5,
            'express': 15,
            'overnight': 25
          };
          return shippingRates[this.shippingMethod] || 5;
        },

        get total() {
          return this.subtotal + this.shippingCost + this.calculateTax() - this.discount;
        }
      };
    }
  </script>
</body>

</html>
