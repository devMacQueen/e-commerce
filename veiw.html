    <script>
        const searchToggle = document.getElementById("searchToggle");
        const searchInput = document.getElementById("searchInput");
        const searchForm = document.getElementById("searchForm");
        const template = document.getElementById("template")
        const product_div = document.getElementById("products-div")
        const category = document.getElementById("category")
        const sort = document.getElementById("sort")

        // Show/hide the input
        searchToggle.addEventListener("click", () => {
            searchInput.classList.toggle("hidden");
            if (!searchInput.classList.contains("hidden")) {
                searchInput.focus();
            }
        });

        async function search(query) {
            try {
                await fetch(`https://dummyjson.com/products/search?q=${query}`)
                    .then(res => res.json())
                    .then(data => {
                        // console.log(data)
                        product_div.innerHTML = ""

                        data.products.forEach(p => {
                            let clone = template.content.cloneNode(true)
                            let card = clone.querySelector(".card")

                            card.querySelector("img").src = p.thumbnail
                            card.querySelector(".title").innerText = p.title
                            card.querySelector(".dec").innerText = p.description
                            card.querySelector(".price").innerText = `$${p.price}`

                            product_div.appendChild(card)
                        });
                    });
            } catch (error) {
                console.error(error.message)
            }
        }

        searchInput.addEventListener("input", (e) => {
            e.preventDefault()
            let input = searchInput.value.toLowerCase().trim()

            if (!input) return

            search(input)
        })

        async function getCat(category) {
            try {
                await fetch(`https://dummyjson.com/products/category/${category}`)
                    .then((res) => res.json())
                    .then((data) => {
                        console.log(data);
                        product_div.innerHTML = ""
                        data.products.forEach(p => {
                            let clone = template.content.cloneNode(true)
                            let card = clone.querySelector(".card")

                            card.querySelector("img").src = p.thumbnail
                            card.querySelector(".title").innerText = p.title
                            card.querySelector(".dec").innerText = p.description
                            card.querySelector(".price").innerText = `$${p.price}`

                            product_div.appendChild(card)
                        });
                    });
            } catch (error) {
                console.error(error.message);
            }
        }

        category.addEventListener("change", (e) => {
            getCat(category.value);
        });

        async function sortFunc(method) {
            try {
                await fetch(`https://dummyjson.com/products?${method}`)
                    .then(res => res.json())
                    .then(data => {
                        product_div.innerHTML = ""
                        data.products.forEach(p => {
                            let clone = template.content.cloneNode(true)
                            let card = clone.querySelector(".card")

                            card.querySelector("img").src = p.thumbnail
                            card.querySelector(".title").innerText = p.title
                            card.querySelector(".dec").innerText = p.description
                            card.querySelector(".price").innerText = `$${p.price}`

                            product_div.appendChild(card)
                        });
                    });
            } catch (error) {
                console.error(error.message);
            }
        }


        sort.addEventListener("change", (e) => {
            if (sort.value === "a-z") {
                sortFunc("sortBy=title&order=asc&limit=100")
            } else if (sort.value === "z-a") {
                sortFunc('sortBy=title&order=desc&limit=100')
            } else if (sort.value === "highest") {
                sortFunc('sortBy=price&order=desc&limit=100')
            } else if (sort.value === "lowest") {
                sortFunc("sortBy=price&order=asc&limit=100")
            }
        })


        async function getAll() {
            await fetch('https://dummyjson.com/products?limit=194')
                .then(res => res.json())

                    product_div.innerHTML = ""

                        let clone = template.content.cloneNode(true)

                        card.querySelector(".dec").innerText = p.description
                        card.querySelector(".price").innerText = `$${p.price}`

                        product_div.appendChild(card)
                    });
                });
        }
