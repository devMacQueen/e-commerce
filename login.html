<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl">
            <div class="p-8">
                <!-- Toggle between Login and Signup -->
                <div class="flex justify-center mb-8">
                    <button id="loginTab"
                        class="px-6 py-2 font-medium text-white bg-blue-500 rounded-l-lg focus:outline-none">
                        Login
                    </button>
                    <button id="signupTab"
                        class="px-6 py-2 font-medium text-blue-500 bg-white border border-blue-500 rounded-r-lg focus:outline-none">
                        Sign Up
                    </button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <h2 class="text-2xl font-bold text-center text-gray-800">Welcome Back</h2>
                    <div>
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" required name="username"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" required name="password"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox"
                                class="h-4 w-4 text-blue-500 focus:ring-blue-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
                        </div>
                        <div class="text-sm">
                            <a href="#" class="font-medium text-blue-500 hover:text-blue-700">Forgot password?</a>
                        </div>
                    </div>
                    <div>
                        <button type="submit" id="loginBtn"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Sign in
                        </button>
                    </div>
                </form>

                <!-- Signup Form (Hidden by default) -->
                <form id="signupForm" class="space-y-6 hidden">
                    <h2 class="text-2xl font-bold text-center text-gray-800">Create Account</h2>
                    <div>
                        <label for="signupName" class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="signupName" required
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="signupEmail" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="signupEmail" required
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="signupPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="signupPassword" required
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm
                            Password</label>
                        <input type="password" id="confirmPassword" required
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex items-center">
                        <input id="terms" name="terms" type="checkbox" required
                            class="h-4 w-4 text-blue-500 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="terms" class="ml-2 block text-sm text-gray-700">
                            I agree to the <a href="#" class="text-blue-500 hover:text-blue-700">Terms and
                                Conditions</a>
                        </label>
                    </div>
                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Create Account
                        </button>
                    </div>
                </form>

                <!-- Social Login -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or continue with</span>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button type="button"
                            class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <img class="h-5 w-5"
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROtT2Um38jtuqcDEmCfCx3tEqzORl-PCvxarTPD9jZlFvd9djCM7Gl36bGA4X-JBaMEmk&usqp=CAU"
                                alt="Google">
                        </button>
                        <button type="button"
                            class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <img class="h-5 w-5"
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROtT2Um38jtuqcDEmCfCx3tEqzORl-PCvxarTPD9jZlFvd9djCM7Gl36bGA4X-JBaMEmk&usqp=CAU"
                                alt="GitHub">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        // Switch to Signup form
        signupTab.addEventListener('click', function (e) {
            e.preventDefault();
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            loginTab.classList.remove('bg-blue-500', 'text-white');
            loginTab.classList.add('bg-white', 'border', 'border-blue-500', 'text-blue-500');
            signupTab.classList.remove('bg-white', 'border', 'border-blue-500', 'text-blue-500');
            signupTab.classList.add('bg-blue-500', 'text-white');
        });

        // Switch to Login form
        loginTab.addEventListener('click', function (e) {
            e.preventDefault();
            signupForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            signupTab.classList.remove('bg-blue-500', 'text-white');
            signupTab.classList.add('bg-white', 'border', 'border-blue-500', 'text-blue-500');
            loginTab.classList.remove('bg-white', 'border', 'border-blue-500', 'text-blue-500');
            loginTab.classList.add('bg-blue-500', 'text-white');
        });



        // const username = document.getElementById("loginUser");
        // const password = document.getElementById("loginPassword");
        const loginBtn = document.getElementById("loginBtn");



        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            console.log("I got clicked");
            loginUser();
        });

        async function loginUser() {
            const formData = new FormData(loginForm);
            console.log(formData)
            const { username, password } = Object.fromEntries(formData);
            console.log(username, password)

            let inputUsername = username.trim();
            let inputPassword = password.trim();

            if (!inputUsername || !inputPassword) {
                console.log("Please input valid login details");
                return;
            }

            loginBtn.disabled = true;

            try {
                const response = await fetch("https://dummyjson.com/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: inputUsername,
                        password: inputPassword,
                    }),
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Login failed");
                }

                console.log("success", result);
                loginForm.reset()
                toast("Login Sucessful")
                setTimeout(() => {


                    window.location.replace("/index.html");
                }, 2000);
            } catch (error) {
                alert(error.message);
                console.error(error.message);
                loginBtn.disabled = false;
            }
        }



        function toast(message, type = "success") {
            const el = document.createElement("div");
            el.textContent = message;
            el.style.cssText =`
            position: fixed;
            top: 50px;
            right: 50px;
            padding: 12px 24px;
            border - radius: 8px;
            color: #fff;
            background: ${ type === "success" ? "#22c55e" : "#ef4444" };
            font - size: 14px;
            z - index: 9999;
            animation: fadeIn 0.3s;
            `;
            document.body.appendChild(el);
        }

    </script>
</body>

</html>>
